<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador MiUandes</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin: 15px 0;
    box-sizing: border-box;
}

button {
    background: #003366;
    color: white;
    border: none;
    padding: 12px 20px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
}

button:hover {
    background: #002244;
}

.resultado {
    margin-top: 20px;
    padding: 15px;
    background: #f4f4f4;
    border-radius: 8px;
    display: none;
    text-align: left;
    line-height: 1.6;
}

a {
    color: #003366;
    text-decoration: none;
    font-weight: bold;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>

<h1>Generador MiUandes</h1>

<input type="text" id="rut" placeholder="Ej: 12345678-9">

<button onclick="generar()">Generar</button>

<div class="resultado" id="resultado">
    <p><strong>Usuario:</strong> <span id="usuario"></span></p>
    <p><strong>Contraseña:</strong> <span id="password"></span></p>

    <hr>

    <p>
        El estudiante puede ingresar a la plataforma en el siguiente enlace:
        <br><br>
        👉 <a href="https://canvas.uandes.cl" target="_blank">
            https://canvas.uandes.cl
        </a>
        <br><br>
        Gracias por contactarnos.
        <br>
        Saludos.
    </p>
</div>

<script>
function generar() {

    let rut = document.getElementById("rut").value.trim();

    // Elimina puntos y espacios
    rut = rut.replace(/\./g, "").replace(/\s/g, "");

    const partes = rut.split("-");

    if (partes.length !== 2) {
        alert("Ingrese un RUT válido.");
        return;
    }

    const numeroRut = partes[0];
    const dv = partes[1].toUpperCase();

    // Usuario: número + DV + @miuandes.cl
    const usuario = numeroRut + dv + "@miuandes.cl";

    let password;

    // Regla:
    // Si el RUT es menor a 10.000.000 -> incluye DV
    // Si es igual o mayor a 10.000.000 -> sin DV
    if (parseInt(numeroRut) < 10000000) {
        password = numeroRut + dv;
    } else {
        password = numeroRut;
    }

    document.getElementById("usuario").textContent = usuario;
    document.getElementById("password").textContent = password;
    document.getElementById("resultado").style.display = "block";
}

// Permite generar presionando Enter
document.getElementById("rut").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        generar();
    }
});
</script>

</body>
</html>
